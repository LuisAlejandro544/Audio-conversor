name: Build Debug APK (FFmpeg C++23)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Permisos mínimos requeridos para leer código y publicar artefactos
permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compilar APK Debug con FFmpeg y C++23
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga completa del código fuente del repositorio
      - name: Descargar código fuente del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # 2. Instalación de herramientas de C++23 y cabeceras de FFmpeg en el sistema
      - name: Instalar dependencias de C++, CMake, Ninja y FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            clang \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev
          echo "Dependencias de C++23 y FFmpeg instaladas correctamente."

      # 3. Configurar Java JDK 17 (Estándar compatible con AGP 9+ y Gradle 9.3+) SIN CACHÉ
      - name: Configurar Java JDK 17 (Sin Caché)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Sin caché de Gradle para garantizar compilación 100% limpia y reproducible
          cache: ''

      # 4. Configurar Android NDK y CMake usando directamente el sdkmanager oficial del runner
      - name: Instalar Android NDK y CMake oficial
        run: |
          echo "Buscando sdkmanager en ANDROID_HOME: $ANDROID_HOME"
          SDKM=""
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKM="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKM=$(which sdkmanager 2>/dev/null || find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          fi
          echo "sdkmanager seleccionado: $SDKM"
          echo "Aceptando licencias del Android SDK..."
          yes | "$SDKM" --licenses || true
          echo "Instalando NDK 26.1.10909125 y CMake 3.22.1..."
          "$SDKM" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      # 5. Generar OBLIGATORIAMENTE desde CERO la firma debug sin esperar
      - name: Generar firma debug (debug.keystore) desde 0 sin esperar
        run: |
          chmod +x ./generate_debug_keystore.sh
          ./generate_debug_keystore.sh ./debug.keystore
          ls -lh ./debug.keystore

      # 6. Preparar permisos y garantizar presencia de gradle-wrapper.jar
      - name: Preparar y verificar Gradle Wrapper
        run: |
          chmod +x ./gradlew
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "⚠️ gradle-wrapper.jar no encontrado. Descargando distribución oficial de Gradle para generarlo..."
            mkdir -p gradle/wrapper
            DIST_URL=$(grep 'distributionUrl' gradle/wrapper/gradle-wrapper.properties | cut -d'=' -f2 | tr -d '\\')
            echo "Descargando desde: $DIST_URL"
            curl -sSL "$DIST_URL" -o /tmp/gradle-dist.zip
            unzip -q /tmp/gradle-dist.zip -d /tmp/gradle-dist
            GRADLE_BIN=$(find /tmp/gradle-dist -name "gradle" -type f -executable | head -n 1)
            echo "Ejecutando $GRADLE_BIN wrapper..."
            "$GRADLE_BIN" wrapper
            rm -rf /tmp/gradle-dist.zip /tmp/gradle-dist
          fi
          echo "✅ gradle-wrapper.jar verificado correctamente:"
          ls -lh gradle/wrapper/gradle-wrapper.jar

      # 7. Compilar APK Debug (SIN CACHÉ, desde 0, sin requerir archivo .env)
      - name: Compilar APK Debug con Gradle (Sin Caché)
        run: |
          ./gradlew assembleDebug \
            --no-build-cache \
            --no-daemon \
            --rerun-tasks \
            --stacktrace

      # 8. Localizar el APK generado
      - name: Verificar archivo APK generado
        run: |
          echo "Buscando APK Debug generado..."
          find app/build/outputs/apk/debug/ -type f -name "*.apk" -ls

      # 9. Subir el APK Debug como artefacto de GitHub Actions para descarga directa
      - name: Publicar APK Debug como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AudioStudio-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
