name: Build Debug APK (FFmpeg C++20)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Permisos mínimos requeridos para leer código y publicar artefactos
permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compilar APK Debug con FFmpeg y C++20
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga completa del código fuente del repositorio
      - name: Descargar código fuente del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # 2. Instalación de herramientas de C++20 y cabeceras de FFmpeg en el sistema
      - name: Instalar dependencias de C++, CMake, Ninja y FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            clang \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev
          echo "Dependencias de C++ y FFmpeg instaladas correctamente."

      # 3. Configurar Java JDK 17 (Estándar compatible con AGP 9+ y Gradle 9.3+) SIN CACHÉ
      - name: Configurar Java JDK 17 (Sin Caché)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Sin caché de Gradle para garantizar compilación 100% limpia y reproducible
          cache: ''

      # 4. Configurar Android SDK, NDK y CMake
      - name: Configurar Android SDK, NDK y CMake
        uses: android-actions/setup-android@v3

      - name: Instalar NDK y CMake para Android
        run: |
          echo "Aceptando licencias del Android SDK..."
          yes | sdkmanager --licenses || true
          echo "Instalando NDK 26.1.10909125 y CMake 3.22.1..."
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      # 5. Generar OBLIGATORIAMENTE desde CERO la firma debug sin esperar
      - name: Generar firma debug (debug.keystore) desde 0 sin esperar
        run: |
          chmod +x ./generate_debug_keystore.sh
          ./generate_debug_keystore.sh ./debug.keystore
          ls -lh ./debug.keystore

      # 6. Preparar permisos del wrapper de Gradle
      - name: Conceder permisos de ejecución a gradlew
        run: chmod +x ./gradlew

      # 7. Compilar APK Debug (SIN CACHÉ, desde 0)
      - name: Compilar APK Debug con Gradle (Sin Caché)
        run: |
          ./gradlew assembleDebug \
            --no-build-cache \
            --no-daemon \
            --rerun-tasks \
            --stacktrace

      # 8. Localizar el APK generado
      - name: Verificar archivo APK generado
        run: |
          echo "Buscando APK Debug generado..."
          find app/build/outputs/apk/debug/ -type f -name "*.apk" -ls

      # 9. Subir el APK Debug como artefacto de GitHub Actions para descarga directa
      - name: Publicar APK Debug como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AudioStudio-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
